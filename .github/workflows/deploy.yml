name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 同一时间只允许一个部署，后触发的会取消正在跑的
concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DEPLOY_DIR: /home/ubuntu/sspOffer-interview-assistant
  PUBLIC_HEALTH_URL: https://szk-everything.xyz/interview/api/auth/me

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check hardcoded root paths
        run: bash scripts/check-frontend-paths.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE: interview
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend (with tests)
        run: mvn -B -ntp package

      - name: Package build context
        run: tar -czf build-context.tar.gz src pom.xml frontend/dist

      - name: Upload build context
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: build-context.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download build context
        uses: actions/download-artifact@v4
        with:
          name: build-context
          path: dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # 只上传约 1MB 的源码+前端产物；jar 在服务器上构建，避免跨境传 88MB
      - name: Upload dist and scripts
        run: |
          TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$TARGET" "mkdir -p incoming"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes dist/build-context.tar.gz "$TARGET:incoming/build-context.tar.gz"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes scripts/remote-deploy.sh "$TARGET:incoming/remote-deploy.sh"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes scripts/server-deploy.sh "$TARGET:incoming/ssp-deploy.sh"

      - name: Build on server, restart and health check
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash incoming/remote-deploy.sh incoming/build-context.tar.gz"

      - name: Verify public endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_HEALTH_URL")
          echo "public /api/auth/me -> $code"
          test "$code" = "401"

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署，后触发的会取消正在跑的
concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DEPLOY_DIR: /home/ubuntu/sspOffer-interview-assistant
  PUBLIC_HEALTH_URL: https://szk-everything.xyz/interview/api/auth/me

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE: interview
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend (with tests)
        run: mvn -B -ntp package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload jar and deploy script
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes dist/*.jar \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/app.jar.new"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes scripts/server-deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/ssp-deploy.sh"

      - name: Restart and health check
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /tmp/ssp-deploy.sh ${{ env.DEPLOY_DIR }}/app.jar.new"

      - name: Verify public endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_HEALTH_URL")
          echo "public /api/auth/me -> $code"
          test "$code" = "401"
